<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriFinance &middot; Dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#333f20">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar" id="topbar"></header>
  <main class="content">
    <div class="page-head">
      <div>
        <span class="eyebrow">Overview</span>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div id="scopeToggleWrap"></div>
    </div>

    <div class="grid grid-4" id="statCards">
      <div class="stat-card"><span class="label">Loading…</span></div>
    </div>

    <div class="card" id="insightsCard" style="margin-top:22px;">
      <h2 style="margin-bottom:12px;">Today's alerts &amp; insights</h2>
      <div id="insightsBody"><p style="color:var(--ink-soft);font-size:0.85rem;margin:0;">Checking your farm…</p></div>
    </div>

    <div class="grid grid-2" style="margin-top:22px;align-items:start;">
      <div class="card">
        <h2>Farm Health Score</h2>
        <div id="scoreBody">
          <div class="skeleton skeleton-block" style="margin-bottom:8px;"></div>
          <div class="skeleton skeleton-line" style="width:70%;"></div>
        </div>
      </div>
      <div class="card">
        <h2>Planting advisor</h2>
        <div id="advisorBody">
          <div class="skeleton skeleton-line" style="width:90%;"></div>
          <div class="skeleton skeleton-line" style="width:60%;"></div>
        </div>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:22px;align-items:start;">
      <div class="card">
        <h2>Cash position</h2>
        <p>Total income vs. expense recorded to date.</p>
        <canvas id="miniChart" height="200" style="width:100%;height:200px;"></canvas>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <h2><span class="live-dot"></span>Live activity</h2>
          <span class="tag-pill">updates every 8s</span>
        </div>
        <ul class="feed" id="activityFeed">
          <li>Loading activity…</li>
        </ul>
      </div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/assistant.js"></script>
<script>
  const user = API.currentUser();
  let showAll = false;

  if (user.role === 'admin') {
    const wrap = document.getElementById('scopeToggleWrap');
    wrap.innerHTML = `<label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--ink-soft);">
      <input type="checkbox" id="scopeToggle" style="width:auto;"> Show whole-farm data (all users)
    </label>`;
    document.getElementById('scopeToggle').addEventListener('change', (e) => {
      showAll = e.target.checked;
      loadDashboard();
      loadFeed();
      loadInsights();
    });
  }

  function money(n) {
    return `$${Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  }

  function q() { return showAll ? '?all=true' : ''; }

  async function loadDashboard() {
    try {
      const d = await API.get('/dashboard' + q());
      const cards = document.getElementById('statCards');
      cards.innerHTML = `
        <div class="stat-card ${d.balance >= 0 ? 'positive' : 'negative'}">
          <span class="label">Net balance</span>
          <div class="value">${money(d.balance)}</div>
        </div>
        <div class="stat-card positive">
          <span class="label">Total income</span>
          <div class="value">${money(d.totalIncome)}</div>
        </div>
        <div class="stat-card negative">
          <span class="label">Total expense</span>
          <div class="value">${money(d.totalExpense)}</div>
        </div>
        <div class="stat-card">
          <span class="label">Outstanding loans</span>
          <div class="value gold">${money(d.outstandingLoans)}</div>
        </div>
        <div class="stat-card">
          <span class="label">Active crops</span>
          <div class="value">${d.activeCrops} <span style="font-size:0.9rem;color:var(--ink-soft);">/ ${d.totalCrops}</span></div>
        </div>
        <div class="stat-card">
          <span class="label">Livestock on farm</span>
          <div class="value">${d.livestockCount}</div>
        </div>
        ${d.totalUsers !== undefined ? `
        <div class="stat-card">
          <span class="label">Registered users</span>
          <div class="value">${d.totalUsers}</div>
        </div>` : ''}
      `;

      AFChart.drawBars(document.getElementById('miniChart'), [
        { label: 'Income', value: d.totalIncome, color: '#47552f' },
        { label: 'Expense', value: -d.totalExpense, color: '#a4432a' },
        { label: 'Net', value: d.balance, color: '#b9822f' }
      ].map(x => ({ ...x, value: x.value })));
    } catch (err) {
      console.error(err);
    }
  }

  function timeAgo(iso) {
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return `${s}s ago`;
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  async function loadFeed() {
    try {
      const d = await API.get('/events' + q());
      const feed = document.getElementById('activityFeed');
      if (!d.events.length) {
        feed.innerHTML = '<li>No activity recorded yet. Start by logging a transaction or adding a crop.</li>';
        return;
      }
      feed.innerHTML = d.events.map(e => `
        <li>
          <span class="dot"></span>
          <div>
            <div>${e.message}</div>
            <div class="time">${timeAgo(e.createdAt)}</div>
          </div>
        </li>
      `).join('');
    } catch (err) {
      console.error(err);
    }
  }

  async function loadInsights() {
    const body = document.getElementById('insightsBody');
    try {
      const [ruleBased, ai] = await Promise.all([
        API.get('/notifications' + q()),
        API.get('/assistant/insights' + q()).catch(() => ({ insights: [] }))
      ]);
      const combined = [
        ...ruleBased.notifications.map(n => ({ tone: n.tone, text: n.text })),
        ...(ai.insights || [])
      ];
      if (!combined.length) {
        body.innerHTML = '<p style="color:var(--ink-soft);font-size:0.85rem;margin:0;">Nothing urgent right now — everything is tracking as expected.</p>';
        return;
      }
      body.innerHTML = combined.map(n => `<div class="insight-card insight-${n.tone || 'info'}">${n.text}</div>`).join('');
    } catch (err) {
      body.innerHTML = `<p style="color:var(--ink-soft);font-size:0.85rem;margin:0;">Could not load insights right now.</p>`;
    }
  }

  async function loadScore() {
    const body = document.getElementById('scoreBody');
    try {
      const d = await API.get('/score' + q());
      if (d.score === null) {
        body.innerHTML = `<p style="color:var(--ink-soft);font-size:0.85rem;margin:0;">${d.message}</p>`;
        return;
      }
      body.innerHTML = `
        <div class="score-widget fade-in">
          <div class="score-ring" style="--pct:${d.score};">
            <div class="score-ring-inner">
              <span class="num">${d.score}</span>
              <span class="of">/ 100</span>
            </div>
          </div>
          <div class="score-breakdown">
            <span class="score-level-badge ${d.tone}">${d.level}</span>
            ${d.breakdown.map(p => `
              <div class="score-row">
                <span class="row-label">${p.label}</span>
                <span class="row-track"><span class="row-fill" style="width:${p.score}%;"></span></span>
                <span class="row-num">${p.score}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    } catch (err) {
      body.innerHTML = `<p style="color:var(--ink-soft);font-size:0.85rem;margin:0;">Could not load your Farm Health Score right now.</p>`;
    }
  }

  async function loadAdvisor() {
    const body = document.getElementById('advisorBody');
    try {
      const d = await API.get('/advisor');
      const list = (items) => items.length
        ? items.map(c => `
            <div class="advisor-crop">
              <div><div class="name">${c.crop}</div><div class="note">${c.note}</div></div>
            </div>
          `).join('')
        : `<p style="color:var(--ink-soft);font-size:0.82rem;margin:0;">Nothing new opens up this window.</p>`;

      body.innerHTML = `
        <div class="insight-card insight-${d.rainfall.tone}" style="margin-bottom:12px;">${d.rainfall.text}</div>
        <div class="advisor-tabs">
          <button class="advisor-tab active" data-tab="now">Plant now &middot; ${d.monthName}</button>
          <button class="advisor-tab" data-tab="next">Coming up &middot; ${d.nextMonthName}</button>
        </div>
        <div class="advisor-list" id="advisorNow">${list(d.plantNow)}</div>
        <div class="advisor-list hidden" id="advisorNext">${list(d.plantNextMonth)}</div>
      `;
      body.querySelectorAll('.advisor-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          body.querySelectorAll('.advisor-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('advisorNow').classList.toggle('hidden', tab.dataset.tab !== 'now');
          document.getElementById('advisorNext').classList.toggle('hidden', tab.dataset.tab !== 'next');
        });
      });
    } catch (err) {
      body.innerHTML = `<p style="color:var(--ink-soft);font-size:0.85rem;margin:0;">Could not load the planting advisor right now.</p>`;
    }
  }

  loadDashboard();
  loadFeed();
  loadInsights();
  loadScore();
  loadAdvisor();
  setInterval(() => { loadDashboard(); loadFeed(); loadInsights(); loadScore(); }, 8000);
</script>
</body>
</html>
